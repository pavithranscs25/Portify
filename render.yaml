services:
  - type: web
    name: portify-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run db:migrate:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
